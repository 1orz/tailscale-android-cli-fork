name: "tagged-release"
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-android"
      - "v*-android-pre"
permissions:
  contents: write
jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Determine release type
          id: release_type
          run: |
            if [[ "${{ github.ref_name }}" == *"-pre" ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # This file is kept on the default branch only so that workflow_dispatch
        # is offered at all -- GitHub lists dispatchable workflows from the
        # default branch, then runs the copy found on the ref you select. The
        # default branch is a plain mirror of upstream tailscale and carries no
        # Android patch, so bail out early with a usable message rather than
        # failing later on a missing build script.
        - name: Ensure this ref carries the Android patch
          run: |
            if [ ! -f scripts/android.sh ]; then
              echo "::error::scripts/android.sh is missing, so this ref has no Android patch."
              echo "::error::Select an *-android-dev branch when dispatching, or push a v*-android tag."
              exit 1
            fi

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
            check-latest: true
          id: go
        - run: go version

        - name: Install Android NDK
          id: setup-ndk
          uses: nttld/setup-ndk@v1
          with:
            ndk-version: r27c
            add-to-path: false

        - name: Install UPX
          uses: crazy-max/ghaction-upx@v3
          with:
            install-only: true

        - name: Build arm
          run: |
            export ANDROID_NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
              ./scripts/android.sh build --pre --upx arm
            else
              ./scripts/android.sh build --upx arm
            fi
        - name: Build arm64
          run: |
            export ANDROID_NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
              ./scripts/android.sh build --pre --upx arm64
            else
              ./scripts/android.sh build --upx arm64
            fi
        
        - name: Compress artifacts
          id: compress_artifacts
          run: |
            eval "$(./build_dist.sh shellvars)"
            echo "VERSION_SHORT=$VERSION_SHORT" >> $GITHUB_OUTPUT
            tar -czf dist/tailscale_${VERSION_SHORT}_arm64.tgz -C dist --transform='s/tailscaled.arm64/tailscaled/' tailscaled.arm64
            tar -czf dist/tailscale_${VERSION_SHORT}_arm.tgz -C dist --transform='s/tailscaled.arm/tailscaled/' tailscaled.arm
            ls -lh dist

        - name: Upload artifacts
          uses: actions/upload-artifact@v4
          with:
            name: release-artifacts
            path: |
              dist/*.tgz

        - name: Upload artifacts for arm
          uses: actions/upload-artifact@v4
          with:
            name: tailscaled.arm.${{ steps.compress_artifacts.outputs.VERSION_SHORT }}
            path: |
              dist/tailscaled.arm
        
        - name: Upload artifacts for arm64
          uses: actions/upload-artifact@v4
          with:
            name: tailscaled.arm64.${{ steps.compress_artifacts.outputs.VERSION_SHORT }}
            path: |
              dist/tailscaled.arm64

        # Allows re-running the workflow for an existing tag without having to
        # delete the release by hand. The tag itself is kept.
        - name: Delete existing release (if any)
          continue-on-error: true
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            gh release delete "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --yes \
              --cleanup-tag=false || true

        - name: Create Release
          uses: softprops/action-gh-release@v3
          with:
            token: "${{ secrets.GITHUB_TOKEN }}"
            tag_name: ${{ github.ref_name }}
            prerelease: ${{ steps.release_type.outputs.is_prerelease }}
            generate_release_notes: true
            fail_on_unmatched_files: true
            files: |
              dist/*.tgz